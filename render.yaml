# Blueprint: Render Dashboard → New → Blueprint (from repo) — создаст БД + API.
# БД в Render: бесплатный план в тесте истекает через 30 дней, см. документацию Render.
# Уже настроен сервис вручную: Build = npm install && npm run build, Start = npm start;
#   DATABASE_URL и секреты — в Environment. Не вставай второй раз тот же Blueprint без удаления дублей.
# При своей внешней БД: убери ниже `databases:` и строку fromDatabase, добавь DATABASE_URL: sync: false.

databases:
  - name: aton-postgres
    plan: free
    region: frankfurt

services:
  - type: web
    name: aton-messenger-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aton-postgres
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_TEXT_MODEL
        value: llama-3.3-70b-versatile
      - key: GOLOS_MAX_PER_WINDOW
        value: "0"
      # 0 = не задавать жёсткий лимит; тогда срабатывает MESSAGES_BOOTSTRAP_SOFT_CAP (последние N без медиа в JSON).
      - key: MESSAGES_BOOTSTRAP_MAX
        value: "0"
      - key: MESSAGES_BOOTSTRAP_SOFT_CAP
        value: "12000"
      - key: OPENAI_API_KEY
        sync: false
      - key: ATON_PUBLIC_URL
        sync: false
