# Два QA-аккаунта: друзья + личка в обе стороны → отчёт + Groq + FTP
#
# Секреты: GROQ_*, FTP_*, плюс для каждого бота **либо** токен, **либо** email+пароль:
#   A: QA_BOT_TOKEN  ИЛИ  QA_EMAIL + QA_PASSWORD
#   B: QA_BOT2_TOKEN  ИЛИ  QA_BOT2_EMAIL + QA_BOT2_PASSWORD
# Опц.: QA_BASE

name: QA bot — social E2E daily

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run social E2E + Groq + FTP
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QA_BASE: https://aton-api.onrender.com
          QA_BOT_TOKEN: ${{ secrets.QA_BOT_TOKEN }}
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_BOT2_TOKEN: ${{ secrets.QA_BOT2_TOKEN }}
          QA_BOT2_EMAIL: ${{ secrets.QA_BOT2_EMAIL }}
          QA_BOT2_PASSWORD: ${{ secrets.QA_BOT2_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_QA_DIR: ${{ secrets.FTP_QA_DIR }}
        run: |
          if [ -z "${GROQ_API_KEY}" ]; then
            echo "Need GROQ_API_KEY"
            exit 1
          fi
          if [ -z "${FTP_HOST}" ] || [ -z "${FTP_USER}" ] || [ -z "${FTP_PASS}" ] || [ -z "${FTP_QA_DIR}" ]; then
            echo "Need FTP_HOST, FTP_USER, FTP_PASS, FTP_QA_DIR for upload"
            exit 1
          fi
          node qa-bots/social-daily.mjs
