# Проверка схемы Prisma и синтаксиса server.js без БД и секретов.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Prisma 6+ требует DATABASE_URL в окружении при validate, даже без реального подключения
      - run: npm run ci
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aton_ci?schema=public
