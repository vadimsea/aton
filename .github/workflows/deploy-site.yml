name: Deploy static site

# Ручной деплой: раннеры GitHub часто не достучаться до FTP hoster.by (ETIMEDOUT / ENETUNREACH),
# из-за чего каждый push в main с статикой даёт красный CI и письмо.
# Заливка: npm run deploy:site (без VPN, FTP_REMOTE_DIR=. в .env.deploy) или Total Commander.
# Секреты: FTP_REMOTE_DIR должен совпадать с реальным путём — для vh141.hoster.by это «.» (корень сессии),
# подкаталога public_html на FTP нет.
on:
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static bundle
        run: |
          mkdir site-deploy
          cp index.html main.js style.css forgot.html reset.html admin-users.html golos-aton-avatar.png site-deploy/

      - name: Upload to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./site-deploy/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
