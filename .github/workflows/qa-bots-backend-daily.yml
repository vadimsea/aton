# Бэкенд-бот: смоук API, метрики, Groq text — отчёты + FTP.
#
# Secrets: GROQ_API_KEY, FTP_HOST, FTP_USER, FTP_PASS, FTP_QA_DIR
# Опц.: GROQ_TEXT_MODEL, QA_BASE

name: QA bot — backend daily (Groq)

on:
  schedule:
    # Среда 12:00 UTC (полдень по Гринвичу), раз в неделю
    - cron: "0 12 * * 3"
  workflow_dispatch:

jobs:
  be:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run backend Groq bot + FTP
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QA_BASE: https://aton-api.onrender.com
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_QA_DIR: ${{ secrets.FTP_QA_DIR }}
        run: |
          if [ -z "${GROQ_API_KEY}" ]; then
            echo "Need GROQ_API_KEY"
            exit 1
          fi
          if [ -z "${FTP_HOST}" ] || [ -z "${FTP_USER}" ] || [ -z "${FTP_PASS}" ] || [ -z "${FTP_QA_DIR}" ]; then
            echo "Need FTP_HOST, FTP_USER, FTP_PASS, FTP_QA_DIR for upload"
            exit 1
          fi
          node qa-bots/backend-daily.mjs
