# Фронтенд-бот: 3 вьюпорта, длинная сессия (по умолч. ≥20 мин), Groq vision (UI/UX), FTP.
#
# Secrets: GROQ_API_KEY, QA_BOT_TOKEN, FTP_HOST, FTP_USER, FTP_PASS, FTP_QA_DIR
# Опц.: GROQ_VISION_MODEL, QA_MIN_TEST_MS, QA_BETWEEN_WAVES_MS

name: QA bot — frontend daily (Groq)

on:
  schedule:
    # Среда 12:00 UTC (полдень по Гринвичу), раз в неделю
    - cron: "0 12 * * 3"
  workflow_dispatch:

jobs:
  fe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run frontend Groq bot + FTP
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QA_BOT_TOKEN: ${{ secrets.QA_BOT_TOKEN }}
          QA_FRONTEND_URL: https://aten.vadzim.by
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_QA_DIR: ${{ secrets.FTP_QA_DIR }}
        run: |
          if [ -z "${GROQ_API_KEY}" ] || [ -z "${QA_BOT_TOKEN}" ]; then
            echo "Need GROQ_API_KEY and QA_BOT_TOKEN"
            exit 1
          fi
          if [ -z "${FTP_HOST}" ] || [ -z "${FTP_USER}" ] || [ -z "${FTP_PASS}" ] || [ -z "${FTP_QA_DIR}" ]; then
            echo "Need FTP_HOST, FTP_USER, FTP_PASS, FTP_QA_DIR for upload"
            exit 1
          fi
          node qa-bots/frontend-daily.mjs
