# Бесплатный смоук прод-API: по расписанию и вручную.
# При падении создаётся Issue — скопируй лог / текст issue в чат с Cursor.
name: QA prod smoke

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run API smoke
        id: smoke
        env:
          # При другом URL API: Settings → Variables → QA_BASE или поменяйте здесь
          QA_BASE: ${{ vars.QA_BASE }}
        run: |
          export QA_BASE="${QA_BASE:-https://aton-api.onrender.com}"
          node scripts/qa-prod-smoke.js

      - name: Создать issue при падении
        if: failure()
        env:
          QA_BASE: ${{ vars.QA_BASE }}
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const base = (process.env.QA_BASE && process.env.QA_BASE.trim()) || 'https://aton-api.onrender.com';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[QA] Смоук API упал — ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`,
              body: [
                'Автоматическая проверка `scripts/qa-prod-smoke.js` не прошла.',
                '',
                `**База:** \`${base}\``,
                '',
                `**Лог workflow:** ${runUrl}`,
                '',
                '### Что сделать',
                '1. Открой лог job «Run API smoke».',
                '2. Скопируй блок с `[FAIL]` и вставь в чат с Cursor.',
                '',
                '_Issue создан Actions; после исправления можно закрыть._'
              ].join('\n')
            });
